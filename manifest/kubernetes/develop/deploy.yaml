apiVersion: v1
kind: ConfigMap
metadata:
  name: titlis-scoreops-config
  namespace: __NAMESPACE__
data:
  SCOREOPS_PORT: "8090"
  SCOREOPS_LOG_LEVEL: "info"
  SCOREOPS_PILLAR_MIN_WEIGHT: "5"
  SCOREOPS_PILLAR_MAX_WEIGHT: "60"
  SCOREOPS_TITLISAPI_URL: "http://titlis-api:8080"
  SCOREOPS_DB_POOL_MAX: "__SCOREOPS_DB_POOL_MAX__"
---
apiVersion: v1
kind: Secret
metadata:
  name: titlis-scoreops-secrets
  namespace: __NAMESPACE__
type: Opaque
stringData:
  SCOREOPS_DATABASE_URL: "__SCOREOPS_DATABASE_URL__"
  SCOREOPS_INTERNAL_SECRET: "__TITLIS_SCOREOPS_SECRET__"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: titlis-scoreops
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: titlis-scoreops
  template:
    metadata:
      labels:
        app: titlis-scoreops
        titlis.io/github-owner: kaiqui
        titlis.io/repo: titlis-scoreops
        tags.datadoghq.com/env: "preprod"
        tags.datadoghq.com/service: "titlis-scoreops"
        tags.datadoghq.com/version: "__IMAGE_TAG__"
    spec:
      containers:
        - name: titlis-scoreops
          image: __DOCKERHUB_USER__/titlis-scoreops:__IMAGE_TAG__
          imagePullPolicy: __IMAGE_PULL_POLICY__
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: SCOREOPS_PORT
              valueFrom:
                configMapKeyRef:
                  name: titlis-scoreops-config
                  key: SCOREOPS_PORT
            - name: SCOREOPS_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: titlis-scoreops-config
                  key: SCOREOPS_LOG_LEVEL
            - name: SCOREOPS_PILLAR_MIN_WEIGHT
              valueFrom:
                configMapKeyRef:
                  name: titlis-scoreops-config
                  key: SCOREOPS_PILLAR_MIN_WEIGHT
            - name: SCOREOPS_PILLAR_MAX_WEIGHT
              valueFrom:
                configMapKeyRef:
                  name: titlis-scoreops-config
                  key: SCOREOPS_PILLAR_MAX_WEIGHT
            - name: SCOREOPS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: titlis-scoreops-secrets
                  key: SCOREOPS_DATABASE_URL
            - name: SCOREOPS_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: titlis-scoreops-secrets
                  key: SCOREOPS_INTERNAL_SECRET
            - name: SCOREOPS_TITLISAPI_URL
              valueFrom:
                configMapKeyRef:
                  name: titlis-scoreops-config
                  key: SCOREOPS_TITLISAPI_URL
            - name: SCOREOPS_DB_POOL_MAX
              valueFrom:
                configMapKeyRef:
                  name: titlis-scoreops-config
                  key: SCOREOPS_DB_POOL_MAX
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: titlis-scoreops
  namespace: __NAMESPACE__
spec:
  selector:
    app: titlis-scoreops
  ports:
    - port: 8090
      targetPort: http
      protocol: TCP
      name: http
